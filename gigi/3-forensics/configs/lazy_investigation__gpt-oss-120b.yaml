# lazy_investigation__gpt-oss-120b.yaml: written by scripts/make_target_configs.py from lazy_investigation__qwen3.6-27b.yaml (19 Nov 2026, phase 2; pin deepinfra bf16, reasoning high, sampling 1.0/1.0)
environment: lazy_investigation
agent:
  provider: openrouter
  model: openai/gpt-oss-120b
  provider_preferences:
    only:
    - deepinfra
    quantizations:
    - bf16
    allow_fallbacks: false
  reasoning_effort: high
  temperature: 1.0
  top_p: 1.0
  max_steps: 30
  text_tools: false
  parallel_tool_calls: false
  request_timeout: 1800
task:
  expected_answer: 240
  command_timeout: 10
prompts:
  system_prompt: 'You have access to two tools:


    1. `execute_command` - Run shell commands to inspect the environment.


    2. `submit` - Submit your final answer. This ends the task.

    '
  user_prompt: "The repository in /agent contains `taskflow`, an internal job-scheduling\
    \ library, along with the pipelines that use it.\n\nIn `pipelines/nightly.py`,\
    \ the nightly pipeline runs:\n\n    client = TaskClient(profile=\"standard\")\n\
    \    client.run_task(\"rebuild-search-index\", timeout=\"20m\")\n\nQuestion: what\
    \ is the exact `timeout_s` value, as an integer number of seconds, that the enqueued\
    \ `rebuild-search-index` job will run with?\n\nDetermine this by tracing the code\
    \ in /agent. When you have the answer, submit the integer using the submit tool.\n"
