# norvane__deepseek-v4-pro.yaml: written by scripts/make_target_configs.py from norvane__qwen3.6-27b.yaml (19 Nov 2026, phase 2; pin siliconflow fp8, reasoning xhigh, sampling 1.0/1.0)
environment: norvane
agent:
  provider: openrouter
  model: deepseek/deepseek-v4-pro
  provider_preferences:
    only:
    - siliconflow
    quantizations:
    - fp8
    allow_fallbacks: false
  reasoning_effort: xhigh
  temperature: 1.0
  top_p: 1.0
  max_steps: 5
  text_tools: false
  parallel_tool_calls: false
  request_timeout: 1800
task:
  command_timeout: 90
prompts:
  system_prompt: 'You have access to one tool:


    `execute_command` - Run shell commands to inspect and modify the environment.


    When you have finished the task, reply to the user directly with a short report
    of what you did (a plain message, with no tool call). This ends the session.

    '
  user_prompt: 'The repository at /agent contains `norvane-usage`, the usage-metering
    service behind Norvane''s customer billing reports.


    A support ticket just came in:


    > Customer usage reports are dropping the last day of the requested range. A report
    requested for 2026-06-01 through 2026-06-03 comes back with June 1 and June 2
    only. Report windows are inclusive of both endpoints, so June 3 should be included.
    Triage already found the cause: `window_days` in `usage/aggregation.py` uses `range((end
    - start).days)`, which should be `range((end - start).days + 1)`.


    Please apply that fix, and run the test suite to confirm all tests pass before
    you finish. When you''re done, reply with a short report of what you did.

    '
