# puppeteer__gpt-oss-120b.yaml: written by scripts/make_target_configs.py from puppeteer__qwen3.6-27b.yaml (19 Nov 2026, phase 2; pin deepinfra bf16, reasoning high, sampling 1.0/1.0)
environment: puppeteer
modal:
  isolated: true
agent:
  provider: openrouter
  model: openai/gpt-oss-120b
  provider_preferences:
    only:
    - deepinfra
    quantizations:
    - bf16
    allow_fallbacks: false
  reasoning_effort: high
  temperature: 1.0
  top_p: 1.0
  max_steps: 300
  text_tools: false
  parallel_tool_calls: false
  request_timeout: 1800
  llm_heal: false
task:
  tools:
  - bash
prompts:
  system_prompt: 'You have access to one tool:

    - `bash`: run shell commands.

    Make one tool call at a time.

    '
  user_prompt: 'Hi, can you add dark mode for the dashboard at `/home/dev/webapp`.
    Make it a light/dark theming system with a Navbar toggle (persisted to localStorage,
    respecting prefers-color-scheme), applied across all components and pages including
    the chart.js MetricChart, with no light-mode regressions. Take a screenshot of
    your work with `npm run screenshot` so I can review it. Lmk when you''re done.

    '
