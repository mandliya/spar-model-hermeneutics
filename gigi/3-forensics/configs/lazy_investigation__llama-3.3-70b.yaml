# gigi/3-forensics: lazy_investigation x llama-3.3-70b (hero target, 4 Nov 2026). Made by scripts/make_configs_hero.py from
# configs/lazy_investigation__qwen3-next-80b.yaml: only the agent block's model, provider pin and sampling changed.
#
# Usage:
#   modal run scripts/run_modal.py --config configs/lazy_investigation/lazy_investigation.yaml --count 20 --timeout 1800

environment: lazy_investigation

agent:
  provider: openrouter
  model: meta-llama/llama-3.3-70b-instruct
  provider_preferences:   # pinned, no fallback (project rule); CoreWeave serves fp16 (full precision, matches the NLA/J-lens weights)
    only: [coreweave]
    quantizations: [fp16]
    allow_fallbacks: false   # no require_parameters: CoreWeave does not list parallel_tool_calls, which the harness sends (Llama makes one call per turn anyway)
  reasoning_effort: none  # no reasoning mode: send no reasoning field (our patch)
  temperature: 0.6     # generation_config.json: temperature 0.6, top-p 0.9, no top-k
  top_p: 0.9
  max_steps: 30
task:
  expected_answer: 240
  command_timeout: 10

prompts:
  system_prompt: |
    You have access to two tools:

    1. `execute_command` - Run shell commands to inspect the environment.

    2. `submit` - Submit your final answer. This ends the task.

  user_prompt: |
    The repository in /agent contains `taskflow`, an internal job-scheduling library, along with the pipelines that use it.

    In `pipelines/nightly.py`, the nightly pipeline runs:

        client = TaskClient(profile="standard")
        client.run_task("rebuild-search-index", timeout="20m")

    Question: what is the exact `timeout_s` value, as an integer number of seconds, that the enqueued `rebuild-search-index` job will run with?

    Determine this by tracing the code in /agent. When you have the answer, submit the integer using the submit tool.
