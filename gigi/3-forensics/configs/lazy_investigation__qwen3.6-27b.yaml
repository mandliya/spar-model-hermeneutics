# gigi/3-forensics: lazy_investigation x qwen3.6-27b (Qwen3.6 27B solo, 7 Nov 2026). Made by scripts/make_configs_qwen36.py from
# configs/lazy_investigation__qwen3-next-80b.yaml: only the agent block's model, provider pin, reasoning switch and sampling changed.
#
# Usage:
#   modal run scripts/run_modal.py --config configs/lazy_investigation/lazy_investigation.yaml --count 20 --timeout 1800

environment: lazy_investigation

agent:
  provider: openrouter
  model: qwen/qwen3.6-27b
  provider_preferences:   # pinned, no fallback (project rule); DeepInfra fp8: Qwen3.6 has no full-precision endpoint
    only: [deepinfra]
    quantizations: [fp8]
    allow_fallbacks: false
  reasoning_effort: disabled  # thinking OFF: {"reasoning": {"effort": "none"}} (patches/hero_reasoning_off.patch)
  temperature: 0.7     # model card, non-thinking mode: temperature 0.7, top-p 0.8, top-k 20, min-p 0, presence_penalty 1.5 (not sent: the harness has no field for it)
  top_p: 0.8
  top_k: 20
  min_p: 0
  max_steps: 30
task:
  expected_answer: 240
  command_timeout: 10

prompts:
  system_prompt: |
    You have access to two tools:

    1. `execute_command` - Run shell commands to inspect the environment.

    2. `submit` - Submit your final answer. This ends the task.

  user_prompt: |
    The repository in /agent contains `taskflow`, an internal job-scheduling library, along with the pipelines that use it.

    In `pipelines/nightly.py`, the nightly pipeline runs:

        client = TaskClient(profile="standard")
        client.run_task("rebuild-search-index", timeout="20m")

    Question: what is the exact `timeout_s` value, as an integer number of seconds, that the enqueued `rebuild-search-index` job will run with?

    Determine this by tracing the code in /agent. When you have the answer, submit the integer using the submit tool.
