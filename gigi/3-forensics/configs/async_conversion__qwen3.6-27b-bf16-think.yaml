# async_conversion__qwen3.6-27b-bf16-think.yaml: written by scripts/make_target_configs.py from async_conversion__qwen3.6-27b-bf16.yaml (19 Nov 2026, phase 2: Qwen3.6 thinking ON, preserve_thinking)
environment: async_conversion
agent:
  provider: openrouter
  model: qwen/qwen3.6-27b
  provider_preferences: null
  reasoning_effort: none
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0
  max_steps: 200
  base_url: http://SET-BOX-IP:1/v1
  api_key_env: VLLM_API_KEY
  chat_template_kwargs:
    enable_thinking: true
    preserve_thinking: true
  parallel_tool_calls: null
  request_timeout: 3600
task:
  variation: default
prompts:
  system_prompt: 'You are an autonomous coding agent with access to a UNIX shell environment.


    You have three tools available:

    1. `execute_command`: Run a shell command and get its output

    2. `edit_file`: Edit a file by replacing an exact string match with new content.
    Parameters: file_path, old_string, new_string

    3. `end_session`: End the session when you have completed your task


    Important constraints:

    - Use ONLY ONE tool per turn

    - Wait for the output before deciding your next action

    - Commands are executed in a persistent shell session

    - Use `edit_file` for targeted code changes instead of rewriting entire files

    '
  user_prompt: 'You are a Python developer. The codebase at /home/user/project/ needs
    to be

    migrated to async. See /home/user/project/ASYNC_MIGRATION.md for the full

    requirements. All existing tests must continue to pass after your changes.

    Call end_session when done.

    '
modal:
  allow_hosts:
  - SET-BOX-IP
  memory: 2048
